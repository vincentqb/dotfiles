# GPT-6 Luna fallback profile for codex.
# Cheapest escape hatch -- use when both sol and terra are refusing or
# throttling and the task is small. $0.10/$0.50 per Mtok, a twentieth of 6.1
# Sol; there is no 6.1 Luna (OpenAI skipped Luna in the 6.1 wave), so GPT-6
# Luna is the current small model. Verified live 2026-10-26 on Mantle through
# the shared Toolbox profile, us-east-1 ONLY (every GPT-6 id 404s from
# us-east-2 / us-west-2). Until 2026-10-26 this profile carried
# openai.gpt-5.6-luna in us-east-2 (kiro-cli meter on an identical trivial
# turn: sol 8.64, terra 4.19, luna 2.16 credits).
# Use with: codex --profile luna
model = "openai.gpt-6-luna"
model_provider = "amazon-bedrock"
model_reasoning_effort = "max"

[model_providers.amazon-bedrock.aws]
# No `profile =` line: since the 2026-10 toolbox builds config.toml vends the
# Caminus credentials through aws.credential_export (`codex amzn
# credential-process`), and codex 0.164 refuses a layered config that carries
# BOTH credential_export and profile ("cannot be combined").
region = "us-east-1"
