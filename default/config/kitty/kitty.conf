include dracula.conf
font_size 14.0
shell /opt/homebrew/bin/fish

# BEGIN_KITTY_FONTS
font_family      family="DejaVu Sans Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
# JuliaMono draws the arrow and math blocks, which DejaVu Sans Mono covers only in part.
symbol_map U+2190-U+21FF,U+2200-U+22FF,U+27C0-U+27FF,U+2900-U+297F,U+2980-U+29FF JuliaMono
