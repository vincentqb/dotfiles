set -s default-terminal   "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB"
set -g  allow-passthrough on
set -g  update-environment "DISPLAY KRB5CCNAME SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION WINDOWID XAUTHORITY KITTY_WINDOW_ID"

# Default shell: fish if installed, else tmux inherits $SHELL.
if-shell 'command -v fish >/dev/null' \
  'run-shell "tmux set-option -g default-shell $(command -v fish)"'

set -g prefix C-q
bind C-q send-prefix
set -g repeat-time 0
set -g mode-keys   vi
set -g status-keys emacs
bind R source-file ~/.tmux.conf \; display-message "Reloaded ~/.tmux.conf"
bind r refresh-client
bind C-p previous-window
bind C-n next-window

# Move the current window left / right (and follow it so it stays focused).
# C-S-Left / C-S-Right works in tmux-aware terminals (kitty, alacritty,
# iTerm2, WezTerm).  The prefixed `<` / `>` fallback is always available
# in case the terminal swallows the C-S-arrow chord.
bind-key -n C-S-Left  swap-window -t -1\; select-window -t -1
bind-key -n C-S-Right swap-window -t +1\; select-window -t +1
bind        <         swap-window -t -1\; select-window -t -1
bind        >         swap-window -t +1\; select-window -t +1

set -s escape-time        0
set -g history-limit      50000
set -g display-time       4000
set -g status-interval    5
set -g focus-events       off
setw -g aggressive-resize on

set -g base-index         1
setw -g pane-base-index   1
set -g renumber-windows   on

set -g mouse          on
set -g set-clipboard  on
set -g status-position top

setw -g monitor-activity on
setw -g monitor-silence  30
set  -g visual-activity  off
set  -g visual-silence   off
set  -g visual-bell      off
set  -g bell-action      other

# Dracula palette, named once. #{@d_x} expands inside both #[...] and style
# options, and the leading # of the hex value survives the expansion.
set -g @d_fg     "#f8f8f2"
set -g @d_gray   "#44475a"
set -g @d_dark   "#282a36"
set -g @d_muted  "#6272a4"
set -g @d_yellow "#f1fa8c"
set -g @d_green  "#50fa7b"
set -g @d_red    "#ff5555"
set -g @d_purple "#bd93f9"
set -g @d_pink   "#ff79c6"

# The bar is the Dracula background rather than gray, so inactive tabs read as
# distinct gray blocks on it instead of merging into one gray run.
set -g status-style                  "bg=#{@d_dark},fg=#{@d_muted}"
set -g message-style                 "bg=#{@d_gray},fg=#{@d_fg}"
# The vi command prompt, so it is visibly not an ordinary message.
set -g message-command-style         "bg=#{@d_gray},fg=#{@d_yellow}"
set -g pane-border-style             "fg=#{@d_gray}"
set -g pane-active-border-style      "fg=#{@d_green}"
# These two do work as ordinary styles, but a format-level #[bg=...] beats
# them, and silence has no style option so the format must set colors anyway.
# Mixing the two mechanisms paints a belled window with the silence color, so
# neutralize them here and let the format own every state.
set -g window-status-activity-style  default
set -g window-status-bell-style      default

# Overlay UI: choose-tree (prefix + w, prefix + a), copy mode and menus all
# ship with tmux's 16-color defaults, which is why they clash with the bar.
# Pink means "the thing under the cursor" here, same as the current tab.
set -g mode-style                    "bg=#{@d_pink},fg=#{@d_dark},bold"
set -g menu-selected-style           "bg=#{@d_pink},fg=#{@d_dark},bold"
set -g menu-style                    "bg=#{@d_dark},fg=#{@d_fg}"
set -g menu-border-style             "fg=#{@d_gray}"
set -g copy-mode-match-style         "bg=#{@d_yellow},fg=#{@d_dark}"
set -g copy-mode-current-match-style "bg=#{@d_pink},fg=#{@d_dark},bold"
set -g copy-mode-mark-style          "bg=#{@d_purple},fg=#{@d_dark}"
# copy-mode-selection-style and copy-mode-position-style already default to
# #{E:mode-style}, so they follow the line above without being set.
# These two are colour options, not style options: they take a single colour
# and do not expand #{...}, so the palette cannot be referenced here.
set -g display-panes-colour          "#6272a4"
set -g display-panes-active-colour   "#50fa7b"
setw -g clock-mode-colour            "#50fa7b"

# Left: session pill flashes yellow while prefix is held.
set -g status-left-length 40
set -g status-left "\
#{?client_prefix,#[bg=#{@d_yellow}#,fg=#{@d_dark}#,bold],#[bg=#{@d_gray}#,fg=#{@d_fg}#,bold]}\
 #S #[default] "
set -g status-right-length 40
# Right: how many windows are stashed in _arc (see "Archive windows" below), so
# the archive never becomes a black hole. Empty when nothing is archived.
set -g status-right "#{S:#{?#{==:#{session_name},_arc},#[fg=#{@d_muted}]#{session_windows} archived ,}}"

# Tabs: bell=red > activity+silence=yellow > activity=purple > gray.
# Read the two flags as one traffic light, since visiting a window clears
# activity but not silence:
#   purple  output arrived, not looked at yet, still within monitor-silence
#   yellow  output arrived, not looked at, then 30s quiet -- a job finished
#   gray    looked at since its last output, so nothing new
#   red     bell
#
# The traffic light lives here once, as a bare color that is empty when the
# window is resting. The bar paints it as a background and the prefix + w / + a
# pickers paint it as a foreground, so the two can never drift apart.
set -g @wstate "#{?window_bell_flag,#{@d_red},\
#{?#{&&:#{window_activity_flag},#{window_silence_flag}},#{@d_yellow},\
#{?window_activity_flag,#{@d_purple},}}}"
#
# @tab holds the body once; #{E:@tab} re-expands it in both formats. The
# separator is a plain space, drawn in status-style, so it shows the bar's own
# background between tabs rather than any glyph.
set -g @tab " #I #{=|14|…:window_name}#{?window_zoomed_flag, +,} "
set -g window-status-style "bg=#{@d_gray},fg=#{@d_fg}"
setw -g window-status-format \
  "#{?#{E:@wstate},#[bg=#{E:@wstate}#,fg=#{@d_dark}],}#{E:@tab}"
setw -g window-status-current-format \
  "#[bg=#{@d_pink},fg=#{@d_dark},bold]#{E:@tab}"
setw -g window-status-separator " "

# Tree mode (prefix + w, prefix + a) is only skinnable through mode-style above
# and choose-tree's -F. The ├─> glyphs, the +/- expand marker and the "1:"
# index prefix are drawn by tmux and no option reaches them.
#
# So -F does the rest in the same idiom as `git dog`: the state color on a
# fixed-width truncated name, then metadata trailing off to the right in muted.
# -K is left alone deliberately -- it formats the (0) (1) shortcut hints, and
# overriding it drops the digit-jump along with the hint.
set -g @pick "\
#{?pane_format,\
#[fg=#{@d_muted}]#{p14:#{=|13|…:pane_current_command}}#{?pane_active,#[fg=#{@d_green}]active,},\
#{?window_format,\
#{?#{E:@wstate},#[fg=#{E:@wstate}],#[fg=#{@d_fg}]}#{p18:#{=|16|…:window_name}}\
#[fg=#{@d_muted}]#{p10:#{t/p:window_activity}}#{p10:#{pane_current_command}}\
#{?#{>:#{window_panes},1},#{window_panes}p,}#{?window_zoomed_flag, +,},\
#[fg=#{@d_muted}]#{p16:#{session_windows} windows}#{?session_attached,#[fg=#{@d_green}]attached,}\
}}"
bind w choose-tree -Zw -F "#{E:@pick}"

# prefix + W  the same list as an fzf popup, for when you would rather type a
# name than navigate a tree. Trades tree mode's tagging, `x` to kill and
# S-Up/S-Down reordering for fuzzy matching and a live preview.
#
# Unlike everywhere else in this file, the colors are literal hex: a popup's
# shell-command is not format-expanded, so #{@d_purple} would arrive at fzf as
# those nine characters. #{...} inside the command below is therefore passed
# through untouched for the inner tmux to expand, and needs no ## escaping.
#
# fzf's --gutter defaults to the U+258C half block, which is why it is set to a
# space here. --pointer is the ❯ that lualine and the fish prompt already use.
#
# The `sh -c` and `--with-shell` are load-bearing, not noise. A popup given one
# command string runs it through default-shell, which here is fish, and fish
# costs ~99ms to start against ~3ms for sh -- measured 283ms to open the popup
# versus 14ms. Passing the shell as separate argv makes tmux execve it directly
# and skips default-shell. fzf spawns $SHELL for every --preview, so without
# --with-shell each arrow key pays fish again: 277ms per keystroke against 6ms.
if-shell 'command -v fzf >/dev/null' {
  bind W display-popup -E -w 80% -h 60% -T ' windows ' \
    -s "bg=#282a36,fg=#f8f8f2" -S "fg=#44475a" \
    sh -c "tmux list-windows -a -f '#{!=:#{session_name},_arc}' \
       -F '#{p14:#{session_name}:#{window_index}}#{p18:#{=|16|…:window_name}}#{p10:#{pane_current_command}}#{t/p:window_activity}' \
     | fzf --reverse --no-sort --info=inline --no-separator --border=none \
         --with-shell 'sh -c' \
         --gutter=' ' --pointer='❯' --marker='❯' --prompt='window ❯ ' \
         --preview 'tmux capture-pane -ep -t {1}' \
         --preview-window='down,50%,border-none' \
         --color=fg:#f8f8f2,bg:#282a36,hl:#bd93f9 \
         --color=fg+:#f8f8f2,bg+:#44475a,hl+:#ff79c6 \
         --color=pointer:#ff79c6,marker:#ff5555,prompt:#50fa7b \
         --color=info:#6272a4,header:#6272a4,gutter:#282a36 \
         --bind 'enter:execute-silent(tmux switch-client -t {1})+accept'"
}

# Archive windows: park one in a detached "_arc" session so it leaves the tab
# bar while its processes keep running -- nothing is killed, and resurrect saves
# _arc like any other session so archives survive a restart.
#   prefix + A  archive the current window
#   prefix + a  pick an archived window and pull it back into this session
bind A if-shell -F '#{>:#{session_windows},1}' {
  run-shell 'tmux has-session -t=_arc 2>/dev/null \
               || tmux new-session -d -s _arc -n __arc__; \
             tmux move-window -d -s "#{session_name}:#{window_index}" -t _arc: ; \
             tmux kill-window -t=_arc:__arc__ 2>/dev/null; \
             tmux refresh-client -S; true'
} {
  display-message "Refusing to archive the last window of #S"
}

# move-window's -t is not format-expanded, so route through run-shell to land
# the window in whichever session the picker was opened from.
bind a if-shell 'tmux has-session -t=_arc 2>/dev/null' {
  choose-tree -Zw -F "#{E:@pick}" -f '#{==:#{session_name},_arc}' \
    "run-shell 'tmux move-window -s \"%%\" -t \"#{client_session}:\"; \
                tmux refresh-client -S'"
} {
  display-message "Nothing archived"
}

# _arc is storage, not a place to work: a bare `tmux attach` picks the newest
# session, which can be _arc. Bounce out of it. switch-client -n is a no-op when
# _arc is the only session, so this cannot loop.
set-hook -g client-attached \
  'if-shell -F "#{==:#{client_session},_arc}" { switch-client -n ; \
     display-message "_arc holds archived windows -- prefix+a restores them" }'

# Plugins (TPM auto-installs on first launch)
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && \
         ~/.tmux/plugins/tpm/bin/install_plugins'"

set -g @plugin 'tmux-plugins/tpm'

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-processes 'ssh mosh-client "~nvim" "~vim" "~less" "~man" "~tail" "~watch" "~claude->claude -c" "~kiro-cli->kiro-cli chat --resume" "~codex->codex resume --last"'

# Continuous save + auto-restore on tmux server start.
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

set -g @plugin 'tmux-plugins/tmux-logging'
# prefix + P  -> save the full scrollback buffer (tmux-history-*.log): a real
#   command transcript an agent can read. (Default M-P; remapped to plain P.)
# prefix + M-P -> toggle live logging going forward (default was P).
# prefix + M-p -> screen-capture: a snapshot of the *visible screen* only. Noise
#   if the pane is a TUI (Claude Code / fzf); left on its default, rarely what you want.
# Read the tmux-history-*.log, not the screen-capture tmux-<s>-<w>-<p>-*.log.
set -g @save-complete-history-key 'P'
set -g @logging_key 'M-P'
# Bigger scrollback so "save complete history" actually has the whole run.
set -g history-limit 100000

run '~/.tmux/plugins/tpm/tpm'
