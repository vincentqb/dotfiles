repos:
- repo: https://github.com/astral-sh/uv-pre-commit
  rev: 0.11.13
  hooks:
    - id: pip-compile
      args: [requirements.in, -o, requirements.txt, --upgrade]
      files: ^requirements\.(in|txt)$

- repo: local
  hooks:
    # ccusage-all reports dollar figures, and its derived columns (Std, Eff) can
    # be wrong while still rendering plausibly -- two such bugs shipped and
    # survived several readings of the table before this hook existed. Runs only
    # when that directory changes.
    - id: ccusage-tests
      name: ccusage-all invariants
      entry: python3 -m unittest discover -s ccusage
      language: system
      pass_filenames: false
      files: ^ccusage/

    # Unquoted expansions are the bug class these scripts are made of: every one
    # of them runs during a machine setup, where $HOME or a `which` result
    # containing a space fails once, late, on someone else's laptop. `system`
    # rather than the upstream hook because shellcheck is already in the
    # Brewfile, and a Docker pull is a poor dependency for a commit.
    - id: shellcheck
      name: shellcheck
      entry: shellcheck
      language: system
      types: [shell]
      exclude_types: [fish]

    # ssa is a recovery tool, so its failures happen when the network is already
    # broken and nobody is watching. The suite is offline and self-gating: it
    # runs bash -n and shellcheck itself, holds the failure table to the column
    # budget, and refuses a property README.md states but nothing checks.
    - id: ssa-tests
      name: ssa properties
      entry: ssa/test-ssa
      language: system
      pass_filenames: false
      files: ^ssa/
